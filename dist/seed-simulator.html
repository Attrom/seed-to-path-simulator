<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seed Simulator</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0a0e1a; color: #e0e4f0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  min-height: 100vh; padding: 20px 16px;
}

h1 {
  font-size: 1.3rem; font-weight: 600;
  letter-spacing: .5px; color: #8eaadc;
}

.header-row {
  display: flex; gap: 14px; align-items: center;
  flex-wrap: wrap; justify-content: center; margin-bottom: 12px;
}



/* ── Controls ─────────────────────────────────────────────────────────────── */
.controls {
  display: flex; gap: 10px; align-items: center;
  flex-wrap: wrap; justify-content: center; margin-bottom: 14px;
}
.controls label { font-size: .85rem; color: #8a90a8; }
.controls input[type="number"],
.controls input[type="text"],
.controls select {
  padding: 7px 10px; border: 1px solid #2a3050; border-radius: 6px;
  background: #141828; color: #e0e4f0; font-size: .9rem;
  font-family: 'Consolas', monospace;
}
.controls input[type="number"] { width: 160px; }
.controls input[type="text"]   { width: 100px; }
.controls select { min-width: 90px; }
.controls input:focus,
.controls select:focus { outline: none; border-color: #5078c0; }

button {
  padding: 7px 18px; border: none; border-radius: 6px;
  font-size: .85rem; font-weight: 600;
  cursor: pointer; transition: background .15s;
}
.btn-primary   { background: #3060b0; color: #fff; }
.btn-primary:hover   { background: #4070c8; }
.btn-secondary { background: #28304a; color: #aab4d0; }
.btn-secondary:hover { background: #343e5c; }
.btn-danger    { background: #702020; color: #e8b0b0; }
.btn-danger:hover    { background: #903030; }

/* ── Tabs ─────────────────────────────────────────────────────────────────── */
.tab-bar {
  display: flex; gap: 2px; margin-bottom: 14px;
}
.tab-btn {
  padding: 8px 22px; border: 1px solid #2a3050; border-bottom: none;
  border-radius: 6px 6px 0 0; background: #10152a; color: #6a7090;
  font-size: .85rem; font-weight: 600; cursor: pointer;
  transition: background .15s, color .15s;
}
.tab-btn:hover { background: #1a2240; color: #8eaadc; }
.tab-btn.active { background: #1a2545; color: #8eaadc; border-color: #3a5080; }
.tab-panel { display: none; width: 100%; }
.tab-panel.active { display: flex; flex-direction: column; align-items: center; }

/* ── Playback controls ────────────────────────────────────────────────────── */
.playback-bar {
  display: flex; gap: 8px; align-items: center;
  width: 100%;
  margin-bottom: 10px; padding: 6px 0;
}
.btn-play {
  width: 34px; height: 34px; border-radius: 50%;
  background: #3060b0; color: #fff; border: none;
  font-size: 14px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background .15s; flex-shrink: 0;
  padding: 0;
}
.btn-play:hover { background: #4070c8; }
.btn-play.playing { background: #d08020; }
.btn-play.playing:hover { background: #e09030; }
.btn-sm { padding: 5px 10px; font-size: .8rem; }
.speed-label {
  font-size: .78rem; color: #6a7090; margin-left: 4px;
}
#speed-select {
  padding: 4px 8px; border: 1px solid #2a3050; border-radius: 6px;
  background: #141828; color: #e0e4f0; font-size: .82rem;
  font-family: 'Consolas', monospace; cursor: pointer;
}
#speed-select:focus { outline: none; border-color: #5078c0; }

.scrubber {
  flex: 1; min-width: 100px; height: 6px;
  -webkit-appearance: none; appearance: none;
  background: #1a2545; border-radius: 3px; outline: none;
  cursor: pointer;
}
.scrubber::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px; border-radius: 50%;
  background: #5090d0; border: 2px solid #0a0e1a;
  cursor: pointer; transition: background .15s;
}
.scrubber::-webkit-slider-thumb:hover { background: #60a0e0; }
.scrubber::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: #5090d0; border: 2px solid #0a0e1a;
  cursor: pointer;
}
.scrubber::-moz-range-track {
  background: #1a2545; height: 6px; border-radius: 3px;
}

.frame-counter {
  font-size: .78rem; color: #6a7090;
  font-family: 'Consolas', monospace;
  white-space: nowrap; min-width: 80px; text-align: right;
}

/* ── Canvas / visualizer ──────────────────────────────────────────────────── */
.canvas-wrap {
  position: relative; border: 1px solid #1e2540; border-radius: 8px;
  overflow: hidden; background: #0d1220; margin-bottom: 14px;
  width: 100%;
}
canvas { display: block; width: 100%; }

.info-bar {
  display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
  font-size: .85rem; margin-bottom: 10px;
}
.info-bar .tag {
  padding: 4px 12px; border-radius: 4px; background: #181e30;
  font-family: 'Consolas', monospace;
}
.tag-win     { color: #5cdb6a; }
.tag-loss    { color: #e05858; }
.tag-neutral { color: #8eaadc; }

.events-strip {
  display: flex; gap: 4px; flex-wrap: wrap; justify-content: center;
  font-size: .78rem; font-family: 'Consolas', monospace;
}
.ev { padding: 3px 8px; border-radius: 4px; }
.ev-gain      { background: #13291a; color: #5cdb6a; }
.ev-loss      { background: #2a1313; color: #e05858; }
.ev-start     { background: #1a2040; color: #8eaadc; }
.ev-end-win   { background: #1a3520; color: #5cdb6a; border: 1px solid #2a6030; }
.ev-end-crash { background: #351a1a; color: #e05858; border: 1px solid #602a2a; }
.ev-arrow     { color: #3a4060; align-self: center; }

.legend {
  display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
  font-size: .75rem; color: #6a7090; margin-top: 10px;
}
.legend span { display: flex; align-items: center; gap: 4px; }
.legend-dot {
  width: 10px; height: 10px; border-radius: 50%; display: inline-block;
}

/* ── Advanced Visualizer ──────────────────────────────────────────────────── */
.adv-controls {
  display: flex; gap: 10px; align-items: center;
  flex-wrap: wrap; justify-content: center; margin-bottom: 10px;
}
.adv-controls label { font-size: .85rem; color: #8a90a8; }
.adv-controls input[type="number"] {
  padding: 7px 10px; border: 1px solid #2a3050; border-radius: 6px;
  background: #141828; color: #e0e4f0; font-size: .9rem;
  font-family: 'Consolas', monospace; width: 160px;
}
.adv-controls input:focus { outline: none; border-color: #5078c0; }

.adv-playback-bar {
  display: flex; gap: 8px; align-items: center;
  width: 100%; margin-bottom: 6px; padding: 6px 0;
}

.adv-canvas-wrap {
  position: relative; overflow: hidden; background: #050a10;
  width: 100vw; margin-left: -16px;
}
.adv-canvas-wrap canvas {
  display: block; width: 100%; height: 700px;
}

/* ── Scanner panel ────────────────────────────────────────────────────────── */

/* top row: seed range, outcome, buttons */
.scanner-row {
  display: flex; gap: 10px; align-items: flex-end;
  flex-wrap: wrap; justify-content: center; margin-bottom: 12px;
}
.scanner-row .field { display: flex; flex-direction: column; gap: 3px; }
.scanner-row .field label {
  font-size: .75rem; color: #6a7090; text-transform: uppercase; letter-spacing: .5px;
}
.scanner-row .field input,
.scanner-row .field select {
  padding: 7px 10px; border: 1px solid #2a3050; border-radius: 6px;
  background: #141828; color: #e0e4f0; font-size: .9rem;
  font-family: 'Consolas', monospace; width: 120px;
}
.scanner-row .field input:focus,
.scanner-row .field select:focus { outline: none; border-color: #5078c0; }
.field-actions { justify-content: flex-end; }
.btn-group { display: flex; gap: 6px; }

/* filter presets row */
.preset-row {
  display: flex; gap: 8px; align-items: center;
  flex-wrap: wrap; justify-content: center; margin-bottom: 12px;
}
.preset-row select {
  padding: 7px 10px; border: 1px solid #2a3050; border-radius: 6px;
  background: #141828; color: #e0e4f0; font-size: .85rem;
  font-family: 'Consolas', monospace; min-width: 200px;
}
.preset-row select:focus { outline: none; border-color: #5078c0; }

/* filter grid: 5-col grid (label + 4 properties), rows for min/max */
.filter-grid {
  display: grid;
  grid-template-columns: auto repeat(12, 1fr);
  gap: 4px 8px;
  margin-bottom: 14px;
  max-width: 100%;
  width: 100%;
}
.fg-corner { }
.fg-header {
  font-size: .72rem; color: #6a7090; text-transform: uppercase;
  letter-spacing: .5px; text-align: center; padding-bottom: 2px;
}
.fg-row-label {
  font-size: .78rem; color: #8a90a8; font-weight: 600;
  display: flex; align-items: center; padding-right: 6px;
  justify-content: flex-end;
}
.fg-cell input {
  width: 100%; padding: 6px 8px;
  border: 1px solid #2a3050; border-radius: 6px;
  background: #141828; color: #e0e4f0;
  font-size: .85rem; font-family: 'Consolas', monospace;
  text-align: center;
}
.fg-cell input:focus { outline: none; border-color: #5078c0; }
.fg-cell input::placeholder { color: #3a4060; }

.scanner-status {
  font-size: .8rem; color: #6a7090; margin-bottom: 8px; min-height: 1.2em;
  text-align: center;
}

.results-table-wrap {
  width: 100%; overflow-x: auto; margin-bottom: 14px;
  border: 1px solid #1e2540; border-radius: 8px; background: #0d1220;
}
.results-table {
  width: 100%; border-collapse: collapse;
  font-size: .82rem; font-family: 'Consolas', monospace;
}
.results-table th {
  padding: 8px 12px; text-align: left;
  background: #141a30; color: #6a7aaa; font-weight: 600;
  border-bottom: 1px solid #2a3050; position: sticky; top: 0;
  cursor: pointer; user-select: none; white-space: nowrap;
}
.results-table th:hover { color: #8eaadc; }
.results-table th .sort-arrow { margin-left: 4px; font-size: .7rem; }
.results-table td {
  padding: 6px 12px; border-bottom: 1px solid #141a2a;
  white-space: nowrap;
}
.results-table tr:hover td { background: #161d35; }
.results-table tr.row-win td:first-child  { border-left: 3px solid #5cdb6a; }
.results-table tr.row-crash td:first-child { border-left: 3px solid #e05858; }
.results-table tr { cursor: pointer; }
.results-table .num-right { text-align: right; }
.outcome-win   { color: #5cdb6a; font-weight: 600; }
.outcome-crash { color: #e05858; font-weight: 600; }

.results-table-wrap { max-height: 420px; overflow-y: auto; }

/* ── Curated list panel ──────────────────────────────────────────────────── */
.curated-warnings {
  width: 100%; margin-bottom: 10px;
  font-size: .8rem; color: #d0a030;
}
.curated-warnings div {
  padding: 4px 10px; background: #1e1a10; border-radius: 4px;
  margin-bottom: 4px; border-left: 3px solid #d0a030;
}

</style>
</head>
<body>

<div class="header-row">
  <h1 id="page-title">Seed Simulator</h1>
</div>

<!-- ── Tabs ────────────────────────────────────────────────────────────────── -->
<div class="tab-bar">
  <button class="tab-btn active" data-tab="tab-visualizer">Visualizer</button>
  <button class="tab-btn" data-tab="tab-advanced">Advanced View</button>
  <button class="tab-btn" data-tab="tab-scanner">Seed Scanner</button>
  <button class="tab-btn" data-tab="tab-curated">Curated List</button>
</div>

<!-- ── Tab 1: Single-seed Visualizer ──────────────────────────────────────── -->
<div id="tab-visualizer" class="tab-panel active">
  <div class="controls">
    <label for="seed-input">Seed:</label>
    <input type="number" id="seed-input" placeholder="leave empty for random">
    <button class="btn-primary" id="btn-run">Simulate</button>
    <button class="btn-secondary" id="btn-random">Random</button>
    <button class="btn-secondary" id="btn-curated-random">Curated Random</button>
  </div>

  <div class="playback-bar">
    <button class="btn-play" id="btn-play" title="Play / Pause">&#9654;</button>
    <button class="btn-secondary btn-sm" id="btn-reset" title="Reset to start">&#8634;</button>
    <label class="speed-label" for="speed-select">Speed</label>
    <select id="speed-select">
      <option value="0.25">0.25x</option>
      <option value="0.5">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="2">2x</option>
      <option value="5">5x</option>
      <option value="10">10x</option>
      <option value="20">20x</option>
    </select>
    <input type="range" id="scrubber" min="0" max="1" value="0" step="1" class="scrubber">
    <span class="frame-counter" id="frame-counter">0 / 0</span>
  </div>

  <div class="info-bar" id="info-bar"></div>
  <div class="canvas-wrap"><canvas id="canvas"></canvas></div>
  <div class="events-strip" id="events-strip"></div>
  <div class="legend" id="legend"></div>
</div>

<!-- ── Tab 2: Advanced Visualizer ─────────────────────────────────────────── -->
<div id="tab-advanced" class="tab-panel">
  <div class="adv-controls">
    <label for="adv-seed-input">Seed:</label>
    <input type="number" id="adv-seed-input" placeholder="leave empty for random">
    <button class="btn-primary" id="adv-btn-run">Simulate</button>
    <button class="btn-secondary" id="adv-btn-curated-random">Curated Random</button>
  </div>

  <div class="adv-playback-bar">
    <button class="btn-play" id="adv-btn-play" title="Play / Pause">&#9654;</button>
    <label class="speed-label" for="adv-speed-select">Speed</label>
    <select id="adv-speed-select">
      <option value="0.25">0.25x</option>
      <option value="0.5">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="2">2x</option>
      <option value="5">5x</option>
      <option value="10">10x</option>
      <option value="20">20x</option>
    </select>
    <input type="range" id="adv-scrubber" min="0" max="1" value="0" step="1" class="scrubber">
    <span class="frame-counter" id="adv-frame-counter">0 / 0</span>
  </div>

  <div class="adv-canvas-wrap"><canvas id="adv-canvas"></canvas></div>
</div>

<!-- ── Tab 3: Seed Scanner ────────────────────────────────────────────────── -->
<div id="tab-scanner" class="tab-panel">

  <!-- seed range + outcome + actions -->
  <div class="scanner-row">
    <div class="field">
      <label for="scan-from">From seed</label>
      <input type="number" id="scan-from" value="0">
    </div>
    <div class="field">
      <label for="scan-to">To seed</label>
      <input type="number" id="scan-to" value="1000">
    </div>
    <div class="field">
      <label for="f-outcome">Outcome</label>
      <select id="f-outcome">
        <option value="any">Any</option>
        <option value="win">Win</option>
        <option value="crash">Crash</option>
      </select>
    </div>
    <div class="field">
      <label for="f-start-team">Starting Team</label>
      <select id="f-start-team">
        <option value="any">Any</option>
        <option value="A">Team A</option>
        <option value="B">Team B</option>
      </select>
    </div>
    <div class="field field-actions">
      <label>&nbsp;</label>
      <div class="btn-group">
        <button class="btn-primary" id="btn-scan">Scan</button>
        <button class="btn-danger" id="btn-stop-scan" hidden>Stop</button>
      </div>
    </div>
  </div>

  <!-- filter presets -->
  <div class="preset-row">
    <select id="preset-select"><option value="">— Saved Filters —</option></select>
    <button class="btn-secondary btn-sm" id="btn-preset-load">Load</button>
    <button class="btn-secondary btn-sm" id="btn-preset-save">Save</button>
    <button class="btn-danger btn-sm" id="btn-preset-delete">Delete</button>
  </div>

  <!-- filter grid: header + min row + max row -->
  <div class="filter-grid">
    <div class="fg-corner"></div>
    <div class="fg-header">Hits</div>
    <div class="fg-header">Multiplier</div>
    <div class="fg-header">Distance</div>
    <div class="fg-header">Ticks</div>
    <div class="fg-header">Hits/Tick</div>
    <div class="fg-header">Positive Bonuses</div>
    <div class="fg-header">Negative Bonuses</div>
    <div class="fg-header">Total Shots</div>
    <div class="fg-header">Team A Shots</div>
    <div class="fg-header">Team B Shots</div>
    <div class="fg-header">Dir Changes</div>
    <div class="fg-header">Shots from Shooter</div>

    <div class="fg-row-label">Min</div>
    <div class="fg-cell"><input type="number" id="f-min-hits" placeholder="—"></div>
    <div class="fg-cell"><input type="number" id="f-min-mult" placeholder="—" step="any"></div>
    <div class="fg-cell"><input type="number" id="f-min-dist" placeholder="—"></div>
    <div class="fg-cell"><input type="number" id="f-min-ticks" placeholder="—"></div>
    <div class="fg-cell"><input type="number" id="f-min-hpt" placeholder="—" step="any"></div>
    <div class="fg-cell"><input type="number" id="f-min-pos-bonuses" placeholder="—"></div>
    <div class="fg-cell"><input type="number" id="f-min-neg-bonuses" placeholder="—"></div>
    <div class="fg-cell"><input type="number" id="f-min-total-shots" placeholder="—"></div>
    <div class="fg-cell"><input type="number" id="f-min-shots-a" placeholder="—"></div>
    <div class="fg-cell"><input type="number" id="f-min-shots-b" placeholder="—"></div>
    <div class="fg-cell"><input type="number" id="f-min-dir-changes" placeholder="—"></div>
    <div class="fg-cell"><input type="number" id="f-min-shots" placeholder="—"></div>

    <div class="fg-row-label">Max</div>
    <div class="fg-cell"><input type="number" id="f-max-hits" placeholder="—"></div>
    <div class="fg-cell"><input type="number" id="f-max-mult" placeholder="—" step="any"></div>
    <div class="fg-cell"><input type="number" id="f-max-dist" placeholder="—"></div>
    <div class="fg-cell"><input type="number" id="f-max-ticks" placeholder="—"></div>
    <div class="fg-cell"><input type="number" id="f-max-hpt" placeholder="—" step="any"></div>
    <div class="fg-cell"><input type="number" id="f-max-pos-bonuses" placeholder="—"></div>
    <div class="fg-cell"><input type="number" id="f-max-neg-bonuses" placeholder="—"></div>
    <div class="fg-cell"><input type="number" id="f-max-total-shots" placeholder="—"></div>
    <div class="fg-cell"><input type="number" id="f-max-shots-a" placeholder="—"></div>
    <div class="fg-cell"><input type="number" id="f-max-shots-b" placeholder="—"></div>
    <div class="fg-cell"><input type="number" id="f-max-dir-changes" placeholder="—"></div>
    <div class="fg-cell"><input type="number" id="f-max-shots" placeholder="—"></div>
  </div>

  <div class="scanner-status" id="scan-status"></div>
  <div class="results-table-wrap" id="results-table-wrap"></div>
</div>

<!-- ── Tab 4: Curated List ──────────────────────────────────────────────── -->
<div id="tab-curated" class="tab-panel">
  <div class="scanner-row">
    <div class="field field-actions">
      <div class="btn-group">
        <button class="btn-primary" id="btn-build-curated">Build Curated List</button>
        <button class="btn-danger" id="btn-stop-curated" hidden>Stop</button>
        <button class="btn-secondary" id="btn-export-curated" hidden>Export JSON</button>
        <button class="btn-secondary" id="btn-import-curated">Import JSON</button>
      </div>
    </div>
  </div>
  <div class="scanner-status" id="curated-status"></div>
  <div class="curated-warnings" id="curated-warnings"></div>
  <div class="results-table-wrap" id="curated-table-wrap"></div>
</div>

<script>
// ── js/shared/prng.js ──
const SharedPrng = {};
(function() {
class FlightRandom {
  constructor() { this.s0 = 0; this.s1 = 0; this.s2 = 0; }

  seed(v) {
    this.s0 = v;
    this.s1 = v * 213947 + 1238971;
    this.s2 = v * 7431 + 94823;
    this.random();
  }

  random(max = Number.MAX_SAFE_INTEGER) {
    let t = this.s0;
    const s = this.s1;
    this.s0 = s;
    t ^= t << 23;
    t ^= t >> 17;
    t ^= s;
    t ^= s >> 26;
    this.s1 = t;
    this.s2 = (1103515245 * this.s2 + 12345) % 2147483648;
    return (this.s0 + this.s1 + this.s2) % max;
  }
}

  SharedPrng.FlightRandom = FlightRandom;
})();

// ── js/shared/renderer.js ──
const SharedRenderer = {};
(function() {
const PAD = { top: 30, right: 30, bottom: 40, left: 55 };
const MIN_CANVAS_H = 250;

function niceStep(range, targetSteps) {
  const raw = range / targetSteps;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const nice = norm < 1.5 ? 1 : norm < 3.5 ? 2 : norm < 7.5 ? 5 : 10;
  return nice * mag;
}

function computeBounds(result) {
  let maxDist = 0, maxAlt = 0;
  for (const p of result.path)      { maxDist = Math.max(maxDist, p.dist); maxAlt = Math.max(maxAlt, p.alt); }
  for (const c of result.collected) { maxDist = Math.max(maxDist, c.dist); maxAlt = Math.max(maxAlt, c.alt + 200); }
  for (const m of result.missed)    { maxDist = Math.max(maxDist, m.dist); maxAlt = Math.max(maxAlt, m.alt + 200); }
  maxDist *= 1.05;
  maxAlt = Math.max(maxAlt * 1.1, 500);
  return { maxDist, maxAlt };
}

function render(result, canvas, { frame = -1, bounds = null } = {}) {
  if (!bounds) bounds = computeBounds(result);
  const { maxDist, maxAlt } = bounds;

  const CANVAS_W = canvas.parentElement?.clientWidth || 960;
  const plotW = CANVAS_W - PAD.left - PAD.right;
  const scale = plotW / maxDist;
  const plotH = Math.max(maxAlt * scale, MIN_CANVAS_H - PAD.top - PAD.bottom);
  const CANVAS_H = Math.round(plotH + PAD.top + PAD.bottom);

  canvas.width = CANVAS_W;
  canvas.height = CANVAS_H;
  const ctx = canvas.getContext('2d');

  const drawAll = frame < 0;
  const lastIdx = drawAll ? result.path.length - 1 : Math.min(frame, result.path.length - 1);
  const curDist = result.path[lastIdx]?.dist ?? 0;

  const sx = d => PAD.left + (d / maxDist) * plotW;
  const sy = a => PAD.top + plotH - (a / maxAlt) * plotH;

  // ── background ──
  const bgGrad = ctx.createLinearGradient(0, 0, 0, CANVAS_H);
  bgGrad.addColorStop(0, '#0a0f22');
  bgGrad.addColorStop(0.7, '#111830');
  bgGrad.addColorStop(1, '#1a2845');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  // ── ground ──
  const groundY = sy(0);
  ctx.fillStyle = '#1a2540';
  ctx.fillRect(PAD.left, groundY, plotW, CANVAS_H - groundY);
  ctx.strokeStyle = '#2a4070'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(PAD.left, groundY); ctx.lineTo(CANVAS_W - PAD.right, groundY); ctx.stroke();

  // ── grid ──
  ctx.strokeStyle = '#1a2040'; ctx.lineWidth = 0.5;
  const altStep = niceStep(maxAlt, 5);
  for (let a = altStep; a < maxAlt; a += altStep) {
    ctx.beginPath(); ctx.moveTo(PAD.left, sy(a)); ctx.lineTo(CANVAS_W - PAD.right, sy(a)); ctx.stroke();
  }
  const distStep = niceStep(maxDist, 6);
  for (let d = distStep; d < maxDist; d += distStep) {
    ctx.beginPath(); ctx.moveTo(sx(d), PAD.top); ctx.lineTo(sx(d), groundY); ctx.stroke();
  }

  // ── axis labels ──
  ctx.fillStyle = '#4a5580'; ctx.font = '10px Consolas, monospace'; ctx.textAlign = 'right';
  for (let a = 0; a <= maxAlt; a += altStep) {
    ctx.fillText(Math.round(a / 100).toString(), PAD.left - 6, sy(a) + 3);
  }
  ctx.textAlign = 'center';
  for (let d = 0; d <= maxDist; d += distStep) {
    ctx.fillText(Math.round(d / 100).toString(), sx(d), groundY + 16);
  }
  ctx.fillStyle = '#4a5580'; ctx.font = '10px Consolas, monospace'; ctx.textAlign = 'center';
  ctx.fillText('distance (\u00d7100)', PAD.left + plotW / 2, CANVAS_H - 6);
  ctx.save();
  ctx.translate(12, PAD.top + plotH / 2); ctx.rotate(-Math.PI / 2);
  ctx.fillText('altitude (\u00d7100)', 0, 0);
  ctx.restore();

  // ── flight path (up to lastIdx) ──
  ctx.lineWidth = 2; ctx.lineJoin = 'round';
  if (lastIdx >= 1) {
    for (let i = 1; i <= lastIdx; i++) {
      const p0 = result.path[i - 1], p1 = result.path[i];
      const m = p1.mult;
      ctx.strokeStyle = m >= 10 ? '#ff6a4a' : m >= 3 ? '#f0b020' : m >= 1.5 ? '#60d870' : '#4090e0';
      ctx.beginPath(); ctx.moveTo(sx(p0.dist), sy(p0.alt)); ctx.lineTo(sx(p1.dist), sy(p1.alt)); ctx.stroke();
    }
  }

  // ── default marker for bonuses / field objects ──
  // Items may carry an optional `marker` object to override styling:
  //   marker.color    – fill color
  //   marker.outline  – stroke color around the circle
  //   marker.opacity  – override alpha (default 0.25)
  //   marker.shape    – 'rect' draws a vertical rectangle instead of a circle
  //   marker.height   – rectangle height in pixels (default 30)
  const drawDefaultDisc = (item) => {
    const x = sx(item.dist), y = sy(item.alt);
    const mk = item.marker;

    if (mk?.shape === 'rect') {
      const wH = mk.worldHeight;
      let rectTop, rectH;
      if (wH != null) {
        rectTop = sy(wH);
        rectH = sy(0) - rectTop;
      } else {
        const h = mk.height ?? 30;
        rectTop = y - h;
        rectH = h;
      }
      ctx.globalAlpha = mk.opacity ?? 0.7;
      ctx.fillStyle = mk.color ?? '#fff';
      ctx.fillRect(x - 3, rectTop, 6, rectH);
      ctx.globalAlpha = 1;
      return;
    }

    if (mk?.shape === 'capsule') {
      const wH   = mk.worldHeight ?? 1000;
      const base = mk.baseHeight ?? 0;
      const topPx = sy(base + wH);
      const botPx = sy(base);
      const bodyH = Math.max(4, botPx - topPx);

      // horizontal extent (world-unit width or fallback to pixel heuristic)
      const pixW = mk.worldWidth != null
        ? Math.max(4, Math.abs(sx(mk.worldWidth) - sx(0)))
        : Math.max(6, bodyH * 0.24);
      const halfW = pixW / 2;
      const r = Math.min(halfW, bodyH / 2);

      // team A → model left of coordinate, team B → right
      let lx, rx;
      if (mk.side === 'left')       { rx = x; lx = x - pixW; }
      else if (mk.side === 'right') { lx = x; rx = x + pixW; }
      else                          { lx = x - halfW; rx = x + halfW; }
      const cx = (lx + rx) / 2;

      ctx.globalAlpha = mk.opacity ?? 0.75;
      ctx.fillStyle = mk.color ?? '#808080';
      ctx.beginPath();
      ctx.moveTo(lx, botPx - r);
      ctx.lineTo(lx, topPx + r);
      ctx.arc(cx, topPx + r, halfW, Math.PI, 0, false);
      ctx.lineTo(rx, botPx - r);
      ctx.arc(cx, botPx - r, halfW, 0, Math.PI, false);
      ctx.closePath();
      ctx.fill();

      if (mk.outline) {
        ctx.strokeStyle = mk.outline;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      ctx.globalAlpha = 1;
      ctx.fillStyle = '#8090b0'; ctx.font = 'bold 9px Consolas, monospace'; ctx.textAlign = 'center';
      ctx.fillText(item.label, cx, topPx - 4);
      return;
    }

    const isHarm = item.isRocket || item.label === 'x0.5';

    ctx.font = 'bold 11px Consolas, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(item.label).width;
    const padX = 6, padY = 4;
    const bw = tw + padX * 2, bh = 14 + padY * 2, br = 5;
    const bx = x - bw / 2, by = y - bh / 2;

    ctx.globalAlpha = mk?.opacity ?? 0.55;
    ctx.fillStyle = '#1a1a6e';
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, br); ctx.fill();

    ctx.globalAlpha = mk?.opacity ?? 0.9;
    ctx.fillStyle = isHarm ? '#e05858' : '#ffffff';
    ctx.fillText(item.label, x, y);
    ctx.globalAlpha = 1; ctx.textBaseline = 'alphabetic';
  };

  for (const m of result.missed) drawDefaultDisc(m);

  for (const c of result.collected) {
    const reached = drawAll || (c.frame != null ? c.frame <= lastIdx : c.dist <= curDist);
    if (!reached) {
      drawDefaultDisc(c);
      continue;
    }

    const x = sx(c.dist), y = sy(c.alt);
    const isHarm = c.isRocket || c.label === 'x0.5';

    ctx.font = 'bold 11px Consolas, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(c.label).width;
    const padX = 6, padY = 4;
    const bw = tw + padX * 2, bh = 14 + padY * 2, br = 5;
    const bx = x - bw / 2, by = y - bh / 2;

    ctx.shadowColor = isHarm ? '#ff4040' : '#40ff80';
    ctx.shadowBlur = 10;
    ctx.fillStyle = isHarm ? '#3a1020' : '#1a1a6e';
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, br); ctx.fill();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, br); ctx.stroke();

    ctx.fillStyle = isHarm ? '#ff6060' : '#ffffff';
    ctx.fillText(c.label, x, y);

    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = isHarm ? '#ff8080' : '#a0ffa0';
    ctx.font = '9px Consolas, monospace';
    ctx.fillText(c.multAfter.toFixed(1) + '\u00d7', x, y + bh / 2 + 13);
  }

  // ── end marker (only when showing final frame) ──
  const atEnd = drawAll || lastIdx >= result.path.length - 1;
  if (atEnd) {
    if (result.landed) {
      const lx = sx(result.path[result.path.length - 1].dist);
      ctx.fillStyle = '#5cdb6a'; ctx.font = '16px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('\u{1F6A2}', lx, groundY + 30);
    } else {
      const last = result.path[result.path.length - 1];
      const lx = sx(last.dist), ly = sy(last.alt);
      ctx.fillStyle = '#e05858'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('\u{1F4A5}', lx, ly - 5);
    }
  }

  // ── ball marker ──
  const cur = result.path[lastIdx];
  if (cur) {
    const px = sx(cur.dist), py = sy(cur.alt);
    const br = 5;

    if (!atEnd) {
      ctx.shadowColor = '#4090e0';
      ctx.shadowBlur = 14;
    }

    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(px, py, br, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#4090e0'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(px, py, br, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0;

    if (!atEnd) {
      const mult = cur.mult;
      const tag = mult.toFixed(1) + '\u00d7';
      ctx.font = 'bold 11px Consolas, monospace';
      ctx.fillStyle = mult >= 10 ? '#ff6a4a' : mult >= 3 ? '#f0b020' : mult >= 1.5 ? '#60d870' : '#4090e0';
      ctx.fillText(tag, px + 2, py - 22);
    }
  }
}

  SharedRenderer.computeBounds = computeBounds;
  SharedRenderer.render = render;
})();

// ── js/shared/advancedRenderer.js ──
const SharedAdvancedRenderer = {};
(function() {
const ADV_SCALE      = 10;
const ADV_VIEWPORT_H = 700;
const ADV_Y_MAX      = 6020;
const ADV_FIELD_W    = 27100;

const advImg   = {};
let   advReady = false;

function tryLoad(name) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => {
      const fb = new Image();
      fb.onload  = () => resolve(fb);
      fb.onerror = () => resolve(null);
      fb.src = '../assets/' + name;
    };
    img.src = 'assets/' + name;
  });
}

async function loadAdvancedAssets() {
  const [bg, pA, pB, ball, scorePanel] = await Promise.all([
    tryLoad('BG.png'),
    tryLoad('player_a.png'),
    tryLoad('player_b.png'),
    tryLoad('Ball.png'),
    tryLoad('score_panel.png'),
  ]);
  advImg.bg         = bg;
  advImg.playerA    = pA;
  advImg.playerB    = pB;
  advImg.ball       = ball;
  advImg.scorePanel = scorePanel;
  advReady          = true;
}

function w2x(wx, camL) { return (wx - camL) / ADV_SCALE; }
function w2y(wy)       { return (ADV_Y_MAX - wy) / ADV_SCALE; }

// ── Bonus / multiplier tag ──────────────────────────────────────────────────

const HIGHLIGHT_DURATION = 40;

function drawTag(ctx, x, y, label, isHarm, highlight) {
  ctx.save();
  ctx.font = 'bold 32px Consolas, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const tw = ctx.measureText(label).width;
  const px = 12, py = 8;
  const bw = tw + px * 2, bh = 36 + py * 2, br = 8;
  const bx = x - bw / 2, by = y - bh / 2;

  if (highlight) {
    ctx.shadowColor = isHarm ? '#ff4040' : '#40ff80';
    ctx.shadowBlur  = 14;
  }
  ctx.fillStyle = isHarm ? '#3a1020' : '#1a1a6e';
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, br); ctx.fill();
  ctx.shadowBlur = 0;

  if (highlight) {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth   = 2.5;
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, br); ctx.stroke();
  }

  ctx.fillStyle = isHarm ? '#e05858' : '#ffffff';
  ctx.fillText(label, x, y);
  ctx.restore();
}

// ── Main render ─────────────────────────────────────────────────────────────

function renderAdvanced(result, canvas, frame) {
  if (!advReady) return;

  const CW = canvas.parentElement?.clientWidth || window.innerWidth;
  canvas.width  = CW;
  canvas.height = ADV_VIEWPORT_H;
  const ctx = canvas.getContext('2d');

  const drawAll = frame < 0;
  const lastIdx = drawAll
    ? result.path.length - 1
    : Math.min(frame, result.path.length - 1);

  const bwx = result.path[lastIdx]?.dist ?? ADV_FIELD_W / 2;
  const bwy = result.path[lastIdx]?.alt  ?? 0;

  // ── Camera (centered on ball, clamped to field) ───────────────────────────
  const viewW = CW * ADV_SCALE;
  let camL = bwx - viewW / 2;
  if (viewW >= ADV_FIELD_W) {
    camL = (ADV_FIELD_W - viewW) / 2;
  } else {
    camL = Math.max(0, Math.min(ADV_FIELD_W - viewW, camL));
  }

  // ── Background ────────────────────────────────────────────────────────────
  const fL = w2x(0, camL);
  const fW = ADV_FIELD_W / ADV_SCALE;

  if (advImg.bg) {
    ctx.drawImage(advImg.bg, fL, 0, fW, ADV_VIEWPORT_H);
  } else {
    ctx.fillStyle = '#1a5c2a';
    ctx.fillRect(fL, 0, fW, ADV_VIEWPORT_H);
  }

  // Dark fill outside the field
  if (fL > 0) {
    ctx.fillStyle = '#050a10';
    ctx.fillRect(0, 0, fL, ADV_VIEWPORT_H);
  }
  const fR = fL + fW;
  if (fR < CW) {
    ctx.fillStyle = '#050a10';
    ctx.fillRect(fR, 0, CW - fR, ADV_VIEWPORT_H);
  }

  // ── Ground line ───────────────────────────────────────────────────────────
  const gY = w2y(0);
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth   = 1;
  ctx.beginPath();
  ctx.moveTo(Math.max(0, fL), gY);
  ctx.lineTo(Math.min(CW, fR), gY);
  ctx.stroke();

  // ── Goalposts ─────────────────────────────────────────────────────────────
  for (const m of result.missed) {
    if (m.marker?.shape !== 'rect') continue;
    const px  = w2x(m.dist, camL);
    const tY  = w2y(m.marker.worldHeight);
    ctx.fillStyle   = '#ffffff';
    ctx.globalAlpha = 0.7;
    ctx.fillRect(px - 4, tY, 8, gY - tY);
    ctx.globalAlpha = 1;
  }

  // ── Players (sprites) ────────────────────────────────────────────────────
  for (const m of result.missed) {
    if (m.marker?.shape !== 'capsule') continue;

    const isA = m.marker.color === '#e05858';
    const img = isA ? advImg.playerA : advImg.playerB;
    if (!img) continue;

    const bH  = m.marker.baseHeight   ?? 0;
    const wH  = m.marker.worldHeight  ?? 1350;
    const tY  = w2y(bH + wH);
    const bY  = w2y(bH);
    const sH  = bY - tY;
    const sW  = sH * (img.naturalWidth / img.naturalHeight);
    const px  = w2x(m.dist, camL);

    const side = m.marker.side;
    const drawX = side === 'left' ? px - sW : side === 'right' ? px : px - sW / 2;
    ctx.drawImage(img, drawX, tY, sW, sH);
  }

  // ── Missed bonuses ────────────────────────────────────────────────────────
  for (const m of result.missed) {
    if (m.marker || !m.label) continue;
    drawTag(ctx, w2x(m.dist, camL), w2y(m.alt), m.label, m.isRocket, false);
  }

  // ── Collected bonuses ─────────────────────────────────────────────────────
  for (const c of result.collected) {
    const hit = drawAll || (c.frame != null ? c.frame <= lastIdx : false);
    const recentHit = hit && !drawAll && c.frame != null
      && (lastIdx - c.frame) < HIGHLIGHT_DURATION;
    drawTag(ctx, w2x(c.dist, camL), w2y(c.alt), c.label, c.isRocket, recentHit);
  }

  // ── Ball (with motion trail at high speeds) ────────────────────────────────
  const bpx = w2x(bwx, camL);
  const bpy = w2y(bwy);
  const br  = 520 / ADV_SCALE / 2;

  const TRAIL_COUNT = 6;
  const TRAIL_MIN_SPEED = 30;
  if (!drawAll && lastIdx >= 1) {
    const prev = result.path[Math.max(0, lastIdx - 1)];
    const dx = bwx - prev.dist;
    const dy = (result.path[lastIdx]?.alt ?? 0) - prev.alt;
    const speed = Math.sqrt(dx * dx + dy * dy);

    if (speed > TRAIL_MIN_SPEED) {
      const lookback = Math.min(lastIdx, TRAIL_COUNT);
      for (let t = lookback; t >= 1; t--) {
        const tp = result.path[lastIdx - t];
        const tx = w2x(tp.dist, camL);
        const ty = w2y(tp.alt);
        const alpha = (1 - t / (lookback + 1)) * 0.4;
        const scale = (1 - t / (lookback + 1)) * 0.7 + 0.3;
        const r = br * scale;
        ctx.globalAlpha = alpha;
        if (advImg.ball) {
          ctx.drawImage(advImg.ball, tx - r, ty - r, r * 2, r * 2);
        } else {
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(tx, ty, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
    }
  }

  if (advImg.ball) {
    ctx.drawImage(advImg.ball, bpx - br, bpy - br, br * 2, br * 2);
  } else {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(bpx, bpy, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  // ── Score panel (fixed to viewport top-center) ─────────────────────────────
  const mult = result.path[lastIdx]?.mult ?? 1;
  if (advImg.scorePanel) {
    const panelW = 200;
    const panelH = panelW * (advImg.scorePanel.naturalHeight / advImg.scorePanel.naturalWidth);
    const panelX = (CW - panelW) / 2;
    const panelY = -2;
    ctx.drawImage(advImg.scorePanel, panelX, panelY, panelW, panelH);

    const textY = panelY + panelH * 0.62;
    ctx.font      = 'bold 20px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const atEnd = drawAll || lastIdx >= result.path.length - 1;
    ctx.fillStyle = atEnd ? (result.landed ? '#5cdb6a' : '#e05858') : '#ffffff';
    ctx.fillText('x' + mult.toFixed(2), CW / 2, textY);
    ctx.textBaseline = 'alphabetic';
  }

  // ── End marker ────────────────────────────────────────────────────────────
  const atEnd2 = drawAll || lastIdx >= result.path.length - 1;
  if (atEnd2) {
    const lastP = result.path[result.path.length - 1];
    const lx = w2x(lastP.dist, camL);
    const ly = w2y(lastP.alt);
    if (result.landed) {
      ctx.font = '28px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('\u26BD', lx, ly - 20);
    } else {
      ctx.font = '24px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('\u{1F4A5}', lx, ly - 10);
    }
  }
}

  SharedAdvancedRenderer.loadAdvancedAssets = loadAdvancedAssets;
  SharedAdvancedRenderer.renderAdvanced = renderAdvanced;
})();

// ── js/shared/scanner.js ──
const SharedScanner = {};
(function() {
function passesFilters(s, filters) {
  if (filters.minHits       != null && s.objectsHit      < filters.minHits)       return false;
  if (filters.maxHits       != null && s.objectsHit      > filters.maxHits)       return false;
  if (filters.minMultiplier != null && s.finalMultiplier  < filters.minMultiplier) return false;
  if (filters.maxMultiplier != null && s.finalMultiplier  > filters.maxMultiplier) return false;
  if (filters.outcome && filters.outcome !== 'any' && s.outcome !== filters.outcome) return false;
  if (filters.minDistance   != null && s.distance         < filters.minDistance)    return false;
  if (filters.maxDistance   != null && s.distance         > filters.maxDistance)    return false;
  if (filters.minTicks      != null && s.ticks            < filters.minTicks)      return false;
  if (filters.maxTicks      != null && s.ticks            > filters.maxTicks)      return false;
  if (filters.minHpt        != null && s.hitsPerTick      < filters.minHpt)       return false;
  if (filters.maxHpt        != null && s.hitsPerTick      > filters.maxHpt)       return false;
  if (filters.minPosBonuses  != null && s.positiveBonuses   < filters.minPosBonuses)  return false;
  if (filters.maxPosBonuses  != null && s.positiveBonuses   > filters.maxPosBonuses)  return false;
  if (filters.minNegBonuses  != null && s.negativeBonuses   < filters.minNegBonuses)  return false;
  if (filters.maxNegBonuses  != null && s.negativeBonuses   > filters.maxNegBonuses)  return false;
  if (filters.minTotalShots != null && s.totalShots        < filters.minTotalShots) return false;
  if (filters.maxTotalShots != null && s.totalShots        > filters.maxTotalShots) return false;
  if (filters.minShotsA    != null && s.shotsA            < filters.minShotsA)    return false;
  if (filters.maxShotsA    != null && s.shotsA            > filters.maxShotsA)    return false;
  if (filters.minShotsB    != null && s.shotsB            < filters.minShotsB)    return false;
  if (filters.maxShotsB    != null && s.shotsB            > filters.maxShotsB)    return false;
  if (filters.minDirChanges != null && s.dirChanges        < filters.minDirChanges) return false;
  if (filters.maxDirChanges != null && s.dirChanges        > filters.maxDirChanges) return false;
  if (filters.minShots      != null && s.shots            < filters.minShots)     return false;
  if (filters.maxShots      != null && s.shots            > filters.maxShots)     return false;
  if (filters.startTeam && s.startTeam !== filters.startTeam) return false;
  return true;
}

/**
 * Scan a range of seeds using the supplied simulateSummary function.
 *
 * @param {Function} simulateSummaryFn  (seed) => summary object
 */
function scanSeeds(simulateSummaryFn, from, to, filters = {}) {
  const results = [];
  for (let seed = from; seed < to; seed++) {
    const s = simulateSummaryFn(seed);
    if (passesFilters(s, filters)) results.push(s);
  }
  return results;
}

/**
 * Async version that yields to the event loop periodically.
 *
 * @param {Function} simulateSummaryFn  (seed) => summary object
 */
async function scanSeedsAsync(simulateSummaryFn, from, to, filters = {}, onProgress = null, abortSignal = null) {
  const results = [];
  const total = to - from;
  const BATCH = 500;

  for (let seed = from; seed < to; seed++) {
    if (abortSignal?.aborted) break;

    const s = simulateSummaryFn(seed);
    if (passesFilters(s, filters)) results.push(s);

    if ((seed - from) % BATCH === 0) {
      if (onProgress) onProgress(seed - from, total);
      await new Promise(r => setTimeout(r, 0));
    }
  }

  if (onProgress) onProgress(total, total);
  return results;
}

async function scanUntilLimit(simulateSummaryFn, filters, limit, onProgress = null, abortSignal = null) {
  const results = [];
  const maxSeed = 4294967296;
  const BATCH = 500;

  for (let seed = 0; seed < maxSeed; seed++) {
    if (abortSignal?.aborted) break;
    if (results.length >= limit) break;

    const s = simulateSummaryFn(seed);
    if (passesFilters(s, filters)) results.push(s);

    if (seed % BATCH === 0) {
      if (onProgress) onProgress(seed, results.length);
      await new Promise(r => setTimeout(r, 0));
    }
  }

  return results;
}

  SharedScanner.scanSeeds = scanSeeds;
  SharedScanner.scanSeedsAsync = scanSeedsAsync;
  SharedScanner.scanUntilLimit = scanUntilLimit;
})();

// ── js/games/fifa-masters/simulation.js ──
const GameFifaMasters = {};
(function() {
const { FlightRandom } = SharedPrng;

const gameInfo = {
  id: 'fifa-masters',
  name: 'FIFA Masters',
};

// ─── Field constants ────────────────────────────────────────────────────────
const FIELD_WIDTH = 27100;
const BONUS_NEGATIVE_PER_SIDE = 5;
const BONUS_POSITIVE_PER_SIDE = 12;
const BONUS_HIT_R2 = 150 * 150;
const MAX_MULT = 500;
const TICK_LIMIT = 20000;

// LAYOUT — all values relative to center (0,0); y = 0 is ground / bottom of goalpost.
const GOAL_POST_POSITION       = 12160;
const MAX_MULTIPLIER_HEIGHT    = 4100;
const MIN_MULTIPLIER_HEIGHT    = 2450;
const GOALPOST_HEIGHT          = 2230;
const PLAYER_MODEL_HEIGHT      = 1350;
const PLAYER_MODEL_WIDTH       = 770;
const PLAYER_BASE_HEIGHT       = 240;
const BALL_MODEL_DIAMETER      = 520;
const PLAYER_POINT_LOW_HEIGHT  = 790;
const PLAYER_POINT_HIGH_HEIGHT = 1950;

const CENTER_X = FIELD_WIDTH / 2;
const GOAL_A_X = CENTER_X - GOAL_POST_POSITION;
const GOAL_B_X = CENTER_X + GOAL_POST_POSITION;

// Arc peak is randomised directly (not vy).
// Range [ARC_PEAK_MIN, ARC_PEAK_MAX), capped at 2500 + dx so short shots stay low.
const ARC_PEAK_MIN = 2500;
const ARC_PEAK_MAX = 5000;
const MAX_BALL_VX  = 180;

// Goalpost targeting weight = proximity^POW * SCALE.
// Tuned so the most-forward attacker (~81% proximity) gets ~90% goalpost chance.
const GOAL_W_POW = 6;
const GOAL_W_SCALE = 96;
const W_PRECISION = 10000;
const LONG_SHOT_THRESHOLD = 7000;

// Players too close for a direct pass (0-based indices).
const CLOSE_PAIRS = new Map([[2, 3], [3, 2], [8, 9], [9, 8]]);

// ─── Segment-to-point distance (for bonus collision) ────────────────────────
function segDistSq(ax, ay, bx, by, px, py) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy;
  if (len2 === 0) { const ex = px - ax, ey = py - ay; return ex * ex + ey * ey; }
  const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2));
  const cx = ax + t * dx - px, cy = ay + t * dy - py;
  return cx * cx + cy * cy;
}

// ─── Player arrangement ─────────────────────────────────────────────────────
// KA - 1A 1B 1A 2B 1A 1B 2A 1B 1A 1B - KB
// Offsets are relative to center (0,0 = FIELD_WIDTH / 2).
const PLAYER_LAYOUT = [
  { team: 'A', offset: -9830 },
  { team: 'B', offset: -8230 },
  { team: 'A', offset: -5770 },
  { team: 'B', offset: -5630 },
  { team: 'B', offset: -3490 },
  { team: 'A', offset: -940 },
  { team: 'B', offset: 940 },
  { team: 'A', offset: 3940 },
  { team: 'A', offset: 5630 },
  { team: 'B', offset: 5770 },
  { team: 'A', offset: 8230 },
  { team: 'B', offset: 9830 },
];

function buildPlayers() {
  const center = FIELD_WIDTH / 2;
  return PLAYER_LAYOUT.map(({ team, offset }) => ({
    x: Math.round(center + offset),
    team,
  }));
}

function findCenterPlayer(players, team) {
  const center = FIELD_WIDTH / 2;
  let best = -1, bestD = Infinity;
  for (let i = 0; i < players.length; i++) {
    if (players[i].team !== team) continue;
    const d = Math.abs(players[i].x - center);
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

// ─── Bonus generation ───────────────────────────────────────────────────────
const BONUS_POSITIVE_TYPES = [
  { add: 1, mult: 1 },
  { add: 1, mult: 1 },
  { add: 1, mult: 1 },
  { add: 2, mult: 1 },
  { add: 2, mult: 1 },
  { add: 5, mult: 1 },
  { add: 10, mult: 1 },
  { add: 0, mult: 2 },
  { add: 0, mult: 3 },
];
const BONUS_NEGATIVE_TYPE = { add: 0, mult: 0.5 };

function bonusLabel(b) {
  return b.add ? `+${b.add}` : `x${b.mult}`;
}

const BONUS_MIN_DIST_SQ = 500 * 500;
const BONUS_PLACE_TRIES = 50;

function tooClose(placed, x, y) {
  for (let j = 0; j < placed.length; j++) {
    const dx = placed[j].x - x, dy = placed[j].y - y;
    if (dx * dx + dy * dy < BONUS_MIN_DIST_SQ) return true;
  }
  return false;
}

function placePair(rng, out, t, hRange, halfW) {
  let ox, y, lx, rx;
  for (let attempt = 0; attempt < BONUS_PLACE_TRIES; attempt++) {
    ox = rng.random(halfW - 1000) + 1000;
    y  = rng.random(hRange) + MIN_MULTIPLIER_HEIGHT;
    lx = GOAL_A_X + ox;
    rx = GOAL_B_X - ox;
    if (!tooClose(out, lx, y) && !tooClose(out, rx, y)) break;
  }
  out.push({ x: lx, y, add: t.add, mult: t.mult });
  out.push({ x: rx, y, add: t.add, mult: t.mult });
}

function generateBonusPositions(rng) {
  const hRange = MAX_MULTIPLIER_HEIGHT - MIN_MULTIPLIER_HEIGHT;
  const halfW  = (GOAL_B_X - GOAL_A_X) / 2;
  const out    = [];
  for (let i = 0; i < BONUS_NEGATIVE_PER_SIDE; i++) {
    placePair(rng, out, BONUS_NEGATIVE_TYPE, hRange, halfW);
  }
  for (let i = 0; i < BONUS_POSITIVE_PER_SIDE; i++) {
    const t = BONUS_POSITIVE_TYPES[rng.random(BONUS_POSITIVE_TYPES.length)];
    placePair(rng, out, t, hRange, halfW);
  }
  return out;
}

function generateBonuses(rng) {
  return generateBonusPositions(rng).map(b => ({
    ...b, label: bonusLabel(b), collected: false,
  }));
}

// ─── Target selection ───────────────────────────────────────────────────────
// Pick a player in the kick direction or the goalpost.
// Nearby players are weighted higher (1/rank).
// Goalpost weight rises steeply with proximity (proximity^6 * 96).
// Excluded: close-pair partner AND the player who just passed (no immediate return).

function chooseTarget(rng, kickerX, kickRight, players, kickerIdx, prevIdx) {
  const goalX = kickRight ? GOAL_B_X : GOAL_A_X;
  const blocked = CLOSE_PAIRS.get(kickerIdx);

  const candidates = [];
  for (let i = 0; i < players.length; i++) {
    if (i === blocked || i === prevIdx) continue;
    if (kickRight ? players[i].x > kickerX : players[i].x < kickerX) {
      candidates.push({ type: 'player', index: i, x: players[i].x });
    }
  }
  candidates.sort((a, b) => Math.abs(a.x - kickerX) - Math.abs(b.x - kickerX));

  const goalDist = GOAL_B_X - GOAL_A_X;
  const proximity = 1 - Math.abs(goalX - kickerX) / goalDist;
  const goalW = Math.max(0.1, Math.pow(proximity, GOAL_W_POW) * GOAL_W_SCALE);

  let totalW = goalW;
  const weights = [];
  for (let i = 0; i < candidates.length; i++) {
    const w = 1 / (i + 1);
    weights.push(w);
    totalW += w;
  }

  let roll = (rng.random(W_PRECISION) / W_PRECISION) * totalW;
  for (let i = 0; i < candidates.length; i++) {
    roll -= weights[i];
    if (roll <= 0) return candidates[i];
  }
  return { type: 'goal', x: goalX };
}

// ─── Arc computation ────────────────────────────────────────────────────────
// y(t) = fromY + V*t − t(t−1)/2.  Peak = fromY + V(V+1)/2.
// Solving y(T) = targetY → T = [(2V+1) + sqrt((2V+1)² − 8·dy)] / 2.

function vFromPeak(peak, fromY) {
  const rel = peak - fromY;
  return Math.max(1, Math.round((-1 + Math.sqrt(1 + 8 * rel)) / 2));
}

function minPeakForSpeed(fromX, fromY, targetX, targetY) {
  const absDx = Math.abs(targetX - fromX);
  if (absDx === 0) return 0;
  const dy = targetY - fromY;
  let Tmin = Math.ceil(absDx / MAX_BALL_VX);
  if (dy > 0 && Tmin * Tmin <= 2 * dy) {
    Tmin = Math.ceil(Math.sqrt(2 * dy)) + 1;
  }
  const V = Math.max(1, Math.ceil((Tmin + 2 * dy / Tmin - 1) / 2));
  return fromY + V * (V + 1) / 2;
}

function computeArc(fromX, fromY, targetX, targetY, V) {
  const dy = targetY - fromY;
  const d = 2 * V + 1;
  const disc = d * d - 8 * dy;
  const T = Math.max(1, Math.round((d + Math.sqrt(Math.max(0, disc))) / 2));
  const vx = (targetX - fromX) / T;
  return { vx, vy: V, T };
}

// ─── Travel-list builder ─────────────────────────────────────────────────────
// Phase 1: decide WHO receives the ball in what order (consumes target-selection
// RNG).  Phase 2 (in simulate / simulateSummary) randomises arc heights.

function buildTravelList(rng, players, startIdx) {
  const targets = [];
  let curX = players[startIdx].x;
  let curIdx = startIdx;
  const otherCenter = findCenterPlayer(players, players[startIdx].team === 'A' ? 'B' : 'A');
  let prevIdx = otherCenter;
  for (let i = 0; i < 200; i++) {
    const kickRight = players[curIdx].team === 'A';
    const target = chooseTarget(rng, curX, kickRight, players, curIdx, prevIdx);
    targets.push(target);
    if (target.type === 'goal') break;
    prevIdx = curIdx;
    curX = target.x;
    curIdx = target.index;
  }
  return targets;
}

// Build the full stop list (start player + travel targets) and assign each
// player stop a y-height.  The ball is received AND shot from this exact point.
// Rule: outgoing x-distance > LONG_SHOT_THRESHOLD → LOW, otherwise → HIGH.
// Goal shots arrive at the goalkeeper's LOW receive height.

function buildStops(players, startIdx, targets) {
  const stops = [
    { type: 'player', index: startIdx, x: players[startIdx].x },
    ...targets,
  ];
  for (let i = 0; i < stops.length; i++) {
    if (stops[i].type === 'goal') {
      stops[i].y = PLAYER_POINT_LOW_HEIGHT;
    } else if (i === 0) {
      stops[i].y = PLAYER_POINT_LOW_HEIGHT;
    } else {
      const dx = Math.abs(stops[i + 1].x - stops[i].x);
      stops[i].y = dx > LONG_SHOT_THRESHOLD
        ? PLAYER_POINT_LOW_HEIGHT
        : PLAYER_POINT_HIGH_HEIGHT;
    }
  }
  return stops;
}

// ─── Full simulation with recording ─────────────────────────────────────────

function simulate(seed) {
  const rng = new FlightRandom();
  rng.seed(seed);

  const players   = buildPlayers();
  const startTeam = rng.random(2) === 0 ? 'A' : 'B';
  const startIdx  = findCenterPlayer(players, startTeam);
  const bonuses   = generateBonuses(rng);

  // Phase 1 — travel list (target-selection RNG)
  const targets  = buildTravelList(rng, players, startIdx);
  const isGoal   = rng.random(2) === 0;
  const stops    = buildStops(players, startIdx, targets);
  const lastStop = stops[stops.length - 1];
  // Goal A: saved = cashout, goal = crash.  Goal B: goal = cashout, saved = crash.
  const landed   = lastStop.x === GOAL_B_X ? isGoal : !isGoal;

  // Phase 2 — simulate arcs (arc-height RNG)
  let ballX = stops[0].x;
  let ballY = stops[0].y;
  let mult     = 1;
  let totalDist = 0;
  let peakAlt   = 0;

  const path      = [];
  const collected = [];
  const events    = [];
  let prevMult    = 1;
  let posHits     = 0;
  let negHits     = 0;

  const pushEv = (label, m) => {
    events.push({ label, mult: m, isLoss: prevMult > m });
    prevMult = m;
  };
  pushEv('kickoff', 1);

  let ticks = 0;
  let lastShotStartFrame = 0;
  let lastShotPeakFrame  = 0;
  let lastShotPeakAlt    = -Infinity;

  for (let s = 0; s < stops.length - 1 && ticks < TICK_LIMIT; s++) {
    const isLastShot = s === stops.length - 2;
    if (isLastShot) lastShotStartFrame = path.length;

    const to       = stops[s + 1];
    const dx       = Math.abs(to.x - ballX);
    const sPeak    = minPeakForSpeed(ballX, ballY, to.x, to.y);
    const pMin     = Math.max(ARC_PEAK_MIN, Math.ceil(sPeak));
    const pMax     = Math.max(pMin, Math.min(ARC_PEAK_MAX, 2500 + dx));
    const peak     = pMin + rng.random(Math.max(1, pMax - pMin));
    const V        = vFromPeak(peak, ballY);
    const { vx, vy: initVy, T } = computeArc(ballX, ballY, to.x, to.y, V);

    let vy = initVy;
    for (let step = 0; step < T && ticks < TICK_LIMIT; step++) {
      const prevBX = ballX, prevBY = ballY;
      ballX += vx;
      ballY += vy;
      vy    -= 1;
      totalDist += Math.abs(vx);
      ticks++;

      if (ballY > peakAlt) peakAlt = ballY;

      if (isLastShot && ballY > lastShotPeakAlt) {
        lastShotPeakAlt = ballY;
        lastShotPeakFrame = path.length;
      }

      for (const b of bonuses) {
        if (b.collected) continue;
        if (segDistSq(prevBX, prevBY, ballX, ballY, b.x, b.y) > BONUS_HIT_R2) continue;
        b.collected = true;
        if (b.mult < 1) negHits++; else posHits++;
        if (b.add)       mult += b.add;
        if (b.mult !== 1) mult *= b.mult;
        mult = Math.min(MAX_MULT, Math.max(0, mult));
        collected.push({
          dist: b.x, alt: b.y, label: b.label,
          isRocket: b.mult < 1,
          multBefore: prevMult, multAfter: mult,
          frame: path.length,
        });
        pushEv(b.label, mult);
      }

      path.push({ dist: ballX, alt: Math.max(0, ballY), mult });
    }

    // snap to exact receive/shoot point
    ballX = to.x;
    ballY = to.y;
  }

  pushEv(isGoal ? 'goal' : 'saved', landed ? mult : 0);

  // uncollected bonuses + field markers → missed
  const missed = [];
  for (const b of bonuses) {
    if (!b.collected) {
      missed.push({ dist: b.x, alt: b.y, label: b.label, isRocket: b.mult < 1 });
    }
  }
  // goalposts
  missed.push({
    dist: GOAL_A_X, alt: 0, label: '', isRocket: false,
    marker: { shape: 'rect', color: '#ffffff', opacity: 0.6, worldHeight: GOALPOST_HEIGHT }
  });
  missed.push({
    dist: GOAL_B_X, alt: 0, label: '', isRocket: false,
    marker: { shape: 'rect', color: '#ffffff', opacity: 0.6, worldHeight: GOALPOST_HEIGHT }
  });
  // field players (capsules — team A left of x, team B right of x)
  for (const p of players) {
    missed.push({
      dist: p.x, alt: 0, label: p.team, isRocket: false,
      marker: {
        shape: 'capsule', color: p.team === 'A' ? '#e05858' : '#4088e0',
        opacity: 0.75, worldHeight: PLAYER_MODEL_HEIGHT,
        worldWidth: PLAYER_MODEL_WIDTH, baseHeight: PLAYER_BASE_HEIGHT,
        side: p.team === 'A' ? 'left' : 'right',
      }
    });
  }
  // goalkeepers (centered on the goalpost)
  missed.push({
    dist: GOAL_A_X, alt: 0, label: 'GK', isRocket: false,
    marker: {
      shape: 'capsule', color: '#e05858', outline: '#fff',
      opacity: 0.85, worldHeight: PLAYER_MODEL_HEIGHT,
      worldWidth: PLAYER_MODEL_WIDTH, baseHeight: PLAYER_BASE_HEIGHT,
    }
  });
  missed.push({
    dist: GOAL_B_X, alt: 0, label: 'GK', isRocket: false,
    marker: {
      shape: 'capsule', color: '#4088e0', outline: '#fff',
      opacity: 0.85, worldHeight: PLAYER_MODEL_HEIGHT,
      worldWidth: PLAYER_MODEL_WIDTH, baseHeight: PLAYER_BASE_HEIGHT,
    }
  });

  let totalShots = 0, shotsA = 0, shotsB = 0, dirChanges = 0;
  let prevTeam = null;
  const shotCounts = new Map();
  for (const s of stops) {
    if (s.type === 'player') {
      const team = players[s.index].team;
      totalShots++;
      if (team === 'A') shotsA++; else shotsB++;
      if (prevTeam !== null && team !== prevTeam) dirChanges++;
      prevTeam = team;
      shotCounts.set(s.index, (shotCounts.get(s.index) || 0) + 1);
    }
  }

  return {
    seed, path, collected, missed, events,
    landed,
    totalMult: landed ? mult : 0,
    ticks,
    shipDist: totalDist,
    peakAlt,
    bonusesCollected: posHits + negHits,
    positiveBonuses: posHits,
    negativeBonuses: negHits,
    totalShots, shotsA, shotsB, dirChanges,
    shots: Math.max(0, ...shotCounts.values()),
    lastShotStartFrame,
    lastShotPeakFrame,
    lastShotGoalX: lastStop.x,
  };
}

// ─── Lightweight summary (no path/event recording) ──────────────────────────

function simulateSummary(seed) {
  const rng = new FlightRandom();
  rng.seed(seed);

  const players   = buildPlayers();
  const startTeam = rng.random(2) === 0 ? 'A' : 'B';
  const startIdx  = findCenterPlayer(players, startTeam);

  const bonuses = generateBonusPositions(rng).map(b => ({
    ...b, collected: false,
  }));

  // Phase 1 — travel list
  const targets  = buildTravelList(rng, players, startIdx);
  const isGoal   = rng.random(2) === 0;
  const stops    = buildStops(players, startIdx, targets);
  const lastStop = stops[stops.length - 1];
  const landed   = lastStop.x === GOAL_B_X ? isGoal : !isGoal;

  // Phase 2 — arcs
  let ballX = stops[0].x;
  let ballY = stops[0].y;
  let mult      = 1;
  let hits      = 0;
  let posHits   = 0;
  let negHits   = 0;
  let peakAlt   = 0;
  let totalDist = 0;

  let ticks = 0;

  for (let s = 0; s < stops.length - 1 && ticks < TICK_LIMIT; s++) {
    const to       = stops[s + 1];
    const dx       = Math.abs(to.x - ballX);
    const sPeak    = minPeakForSpeed(ballX, ballY, to.x, to.y);
    const pMin     = Math.max(ARC_PEAK_MIN, Math.ceil(sPeak));
    const pMax     = Math.max(pMin, Math.min(ARC_PEAK_MAX, 2500 + dx));
    const peak     = pMin + rng.random(Math.max(1, pMax - pMin));
    const V        = vFromPeak(peak, ballY);
    const { vx, vy: initVy, T } = computeArc(ballX, ballY, to.x, to.y, V);

    let vy = initVy;
    for (let step = 0; step < T && ticks < TICK_LIMIT; step++) {
      const prevBX = ballX, prevBY = ballY;
      ballX += vx;
      ballY += vy;
      vy    -= 1;
      totalDist += Math.abs(vx);
      ticks++;
      if (ballY > peakAlt) peakAlt = ballY;

      for (const b of bonuses) {
        if (b.collected) continue;
        if (segDistSq(prevBX, prevBY, ballX, ballY, b.x, b.y) > BONUS_HIT_R2) continue;
        b.collected = true;
        hits++;
        if (b.mult < 1) negHits++; else posHits++;
        if (b.add)       mult += b.add;
        if (b.mult !== 1) mult *= b.mult;
        mult = Math.min(MAX_MULT, Math.max(0, mult));
      }
    }

    ballX = to.x;
    ballY = to.y;
  }

  return {
    seed,
    startTeam,
    objectsHit:      hits,
    finalMultiplier:  mult,
    totalMultiplier:  landed ? mult : 0,
    outcome:          landed ? 'win' : 'crash',
    distance:         totalDist,
    peakAltitude:     peakAlt,
    ticks,
    hitsPerTick:      ticks > 0 ? hits / ticks : 0,
    bonusesCollected: posHits + negHits,
    positiveBonuses:  posHits,
    negativeBonuses:  negHits,
    ...(() => {
      let totalShots = 0, shotsA = 0, shotsB = 0, dirChanges = 0;
      let prevTeam = null;
      const sc = new Map();
      for (const s of stops) {
        if (s.type === 'player') {
          const team = players[s.index].team;
          totalShots++;
          if (team === 'A') shotsA++; else shotsB++;
          if (prevTeam !== null && team !== prevTeam) dirChanges++;
          prevTeam = team;
          sc.set(s.index, (sc.get(s.index) || 0) + 1);
        }
      }
      return {
        totalShots, shotsA, shotsB, dirChanges,
        shots: Math.max(0, ...sc.values()),
      };
    })(),
  };
}

  GameFifaMasters.simulate = simulate;
  GameFifaMasters.simulateSummary = simulateSummary;
  GameFifaMasters.gameInfo = gameInfo;
})();

let currentResult = null;

let accumulator   = 0;

function totalFrames() {
  return currentResult ? currentResult.path.length : 0;
}

function getSpeed() {

}

function syncScrubber() {
  const total = totalFrames();
  scrubber.max = Math.max(0, total - 1);
  scrubber.value = animFrame < 0 ? total - 1 : animFrame;
  frameCounter.textContent = `${animFrame < 0 ? total : animFrame + 1} / ${total}`;
}

function drawCurrentFrame() {
  if (!currentResult) return;
  render(currentResult, canvas, { frame: animFrame, bounds: currentBounds });
}

function stopPlayback() {
  playing = false;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  btnPlay.textContent = '\u25b6';
  btnPlay.classList.remove('playing');
}

function startPlayback() {
  if (!currentResult || totalFrames() === 0) return;
  if (animFrame < 0 || animFrame >= totalFrames() - 1) {
    animFrame = 0;
    accumulator = 0;
  }
  playing = true;
  btnPlay.textContent = '\u23f8';
  btnPlay.classList.add('playing');
  lastTimestamp = null;
  rafId = requestAnimationFrame(animationLoop);
}

let lastTimestamp = null;

function animationLoop(timestamp) {
  if (!playing) return;

  if (lastTimestamp === null) lastTimestamp = timestamp;
  const dt = (timestamp - lastTimestamp) / 1000;
  lastTimestamp = timestamp;

  const ticksPerSec = 60 * getSpeed();
  accumulator += dt * ticksPerSec;

  const steps = Math.floor(accumulator);
  if (steps > 0) {
    accumulator -= steps;
    animFrame = Math.min(animFrame + steps, totalFrames() - 1);
  }

  drawCurrentFrame();
  syncScrubber();

  if (animFrame >= totalFrames() - 1) {
    animFrame = -1;
    drawCurrentFrame();
    syncScrubber();
    updateInfoBar(currentResult, infoBar);
    updateEventsStrip(currentResult, eventsStrip);
    stopPlayback();
    return;
  }

  rafId = requestAnimationFrame(animationLoop);
}

async function runScan() {

  const to   = parseInt(scanTo.value, 10)   || 1000;

  btnScan.disabled = true;
  btnStopScan.hidden = false;

  const results = await scanSeedsAsync(activeGame.simulateSummary, from, to, filters, (done, tot) => {
    scanStatus.textContent = `Scanning ${done} / ${tot} ...`;
  }, scanAbort.signal);

  btnScan.disabled = false;
  btnStopScan.hidden = true;

  if (scanAbort.signal.aborted) {
    scanStatus.textContent = `Scan aborted. Found ${results.length} matching seeds so far.`;
  } else {
    scanStatus.textContent = `Done. ${results.length} seed${results.length !== 1 ? 's' : ''} matched out of ${total} scanned.`;
  }

  const table = renderResultsTable(results, tableWrap);
  if (table) {
    table.addEventListener('click', e => {
      const row = e.target.closest('tr[data-seed]');

      $('tab-visualizer').classList.add('active');
      runSingle(seed);
    });
  }

  scanAbort = null;
}

      localStorage.removeItem(CURATED_RESULTS_KEY);

    const cacheObj = {};

    const raw = localStorage.getItem(CURATED_RESULTS_KEY);
    if (raw) curatedResults = JSON.parse(raw);
    const cacheRaw = localStorage.getItem(CURATED_CACHE_KEY);
    if (cacheRaw) {
      const obj = JSON.parse(cacheRaw);
      for (const k of Object.keys(obj)) curatedCache.set(k, obj[k]);
    }
  } catch (_) { /* corrupt data — ignore */ }
}

function stopCuratedWorkers() {
  for (const w of curatedWorkers) w.terminate();
  curatedWorkers = [];
}

function finalizeCuratedList(allResults, names) {
  const LIMIT = 50;
  const seedMap = new Map();
  const warnings = [];

  for (const { name, results } of allResults) {
    curatedCache.set(name, results);
    if (results.length < LIMIT) {
      warnings.push(`Preset "${name}" found only ${results.length} seed${results.length !== 1 ? 's' : ''} (target: ${LIMIT}).`);
    }
    for (const m of results) {
      if (seedMap.has(m.seed)) {
        seedMap.get(m.seed).filterNames.push(name);
      } else {
        seedMap.set(m.seed, {
          seed: m.seed,
          startTeam: m.startTeam,
          totalMultiplier: m.outcome === 'crash' ? 0 : m.totalMultiplier,
          filterNames: [name],
          weight: 1,
        });
      }
    }
  }

  const list = [...seedMap.values()].sort((a, b) => a.seed - b.seed);
  for (const entry of list) {
    entry.filterNames = entry.filterNames.join(', ');
  }

  curatedResults = list;

  btnBuildCurated.disabled = false;
  btnStopCurated.hidden = true;

  const scannedCount = allResults.filter(r => !r.cached).length;
  const cachedCount  = allResults.length - scannedCount;
  let statusParts = [`${list.length} unique seed${list.length !== 1 ? 's' : ''}`];
  if (scannedCount > 0) statusParts.push(`${scannedCount} scanned`);
  if (cachedCount > 0)  statusParts.push(`${cachedCount} from cache`);
  curatedStatus.textContent = `Done. ${statusParts.join(', ')}.`;

  if (warnings.length > 0) {
    curatedWarnings.innerHTML = warnings.map(w => `<div>${w}</div>`).join('');
  }

  const table = renderCuratedTable(list, curatedTableWrap);
  if (table) {
    table.addEventListener('click', e => {
      const row = e.target.closest('tr[data-seed]');
      if (!row) return;
      const seed = parseInt(row.dataset.seed, 10);
      tabBtns.forEach(b => b.classList.remove('active'));
      tabPanels.forEach(p => p.classList.remove('active'));
      document.querySelector('[data-tab="tab-visualizer"]').classList.add('active');
      $('tab-visualizer').classList.add('active');
      runSingle(seed);
    });
  }

  btnExportCurated.hidden = list.length === 0;
  btnImportCurated.hidden = false;

  saveCuratedToStorage();
}

async function buildCuratedList() {
  stopCuratedWorkers();

  const presets = loadPresets();
  const names = Object.keys(presets).sort((a, b) => a.localeCompare(b));

  if (names.length === 0) {
    curatedStatus.textContent = 'No saved filter presets found. Save some presets in the Scanner tab first.';
    return;
  }

  const cachedNames = names.filter(n => curatedCache.has(n));
  let namesToScan = names;

  if (cachedNames.length > 0) {
    const msg = `${cachedNames.length} of ${names.length} preset(s) have cached results:\n` +
      cachedNames.map(n => `  \u2022 "${n}" (${curatedCache.get(n).length} seeds)`).join('\n') +
      '\n\nKeep cached results and only scan new presets?\n' +
      '  OK = keep cache     Cancel = discard & rescan all';
    if (confirm(msg)) {
      namesToScan = names.filter(n => !curatedCache.has(n));
    } else {
      curatedCache.clear();
    }
  }

  btnBuildCurated.disabled = true;
  btnStopCurated.hidden = false;
  btnExportCurated.hidden = true;
  curatedWarnings.innerHTML = '';
  curatedTableWrap.innerHTML = '';
  curatedResults = null;

  if (namesToScan.length === 0) {
    const allResults = names.map(name => ({ name, results: curatedCache.get(name), cached: true }));
    finalizeCuratedList(allResults, names);
    return;
  }

  const LIMIT = 50;
  const progress = {};
  let completed = 0;

  function updateStatus() {
    curatedStatus.textContent = `Scanning ${namesToScan.length} preset(s) in parallel \u2014 ${completed}/${namesToScan.length} done` +
      (cachedNames.length > 0 && curatedCache.size > 0 ? ` (${names.length - namesToScan.length} cached)` : '');
  }

  const workerPromises = namesToScan.map(name => new Promise(resolve => {
    const filters = buildFiltersFromState(presets[name]);
    const worker = new Worker(workerUrl);
    curatedWorkers.push(worker);

    progress[name] = { seed: 0, found: 0, done: false };

    worker.onmessage = (e) => {
      const msg = e.data;
      if (msg.type === 'progress') {
        progress[name] = { seed: msg.seed, found: msg.found, done: false };
        updateStatus();
      } else if (msg.type === 'done') {
        progress[name] = { seed: 0, found: msg.results.length, done: true };
        completed++;
        updateStatus();
        resolve({ name, results: msg.results, cached: false });
      }
    };

    worker.onerror = () => {
      progress[name] = { seed: 0, found: 0, done: true };
      completed++;
      updateStatus();
      resolve({ name, results: [], cached: false });
    };

    worker.postMessage({ filters, limit: LIMIT });
  }));

  updateStatus();

  const scannedResults = await Promise.all(workerPromises);
  stopCuratedWorkers();

  const allResults = names.map(name => {
    const scanned = scannedResults.find(r => r.name === name);
    if (scanned) return scanned;
    return { name, results: curatedCache.get(name), cached: true };
  });

  finalizeCuratedList(allResults, names);
}

btnBuildCurated.addEventListener('click', buildCuratedList);
btnStopCurated.addEventListener('click', () => {
  stopCuratedWorkers();
  curatedStatus.textContent = 'Build aborted.';
  btnBuildCurated.disabled = false;
  btnStopCurated.hidden = true;
});

btnExportCurated.addEventListener('click', () => {
  if (!curatedResults || curatedResults.length === 0) return;
  const exportData = curatedResults.map(r => ({
    seed: r.seed,
    startTeam: r.startTeam,
    totalMultiplier: r.totalMultiplier,
    filters: r.filterNames.split(', '),
    weight: r.weight,
  }));
  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'curated-seeds.json';
  a.click();
  URL.revokeObjectURL(url);
});

btnImportCurated.addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.addEventListener('change', () => {
    const file = input.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data)) throw new Error('Expected an array');
        const list = data.map(r => ({
          seed: Number(r.seed),
          startTeam: String(r.startTeam ?? ''),
          totalMultiplier: Number(r.totalMultiplier ?? 0),
          filterNames: Array.isArray(r.filters) ? r.filters.join(', ') : String(r.filterNames ?? r.filters ?? ''),
          weight: Number(r.weight ?? 1),
        }));
        if (list.some(r => isNaN(r.seed))) throw new Error('Invalid seed value(s)');

        curatedResults = list;
        curatedCache.clear();
        saveCuratedToStorage();
        restoreCuratedUI();
        curatedStatus.textContent = `Imported ${list.length} seed${list.length !== 1 ? 's' : ''}.`;
        curatedWarnings.innerHTML = '';
      } catch (err) {
        alert('Import failed: ' + err.message);
      }
    };
    reader.readAsText(file);
  });
  input.click();
});

function restoreCuratedUI() {
  if (!curatedResults || curatedResults.length === 0) return;
  btnExportCurated.hidden = false;
  btnImportCurated.hidden = false;
  curatedStatus.textContent = `Loaded ${curatedResults.length} seed${curatedResults.length !== 1 ? 's' : ''} from previous session.`;
  const table = renderCuratedTable(curatedResults, curatedTableWrap);
  if (table) {
    table.addEventListener('click', e => {
      const row = e.target.closest('tr[data-seed]');
      if (!row) return;
      const seed = parseInt(row.dataset.seed, 10);
      tabBtns.forEach(b => b.classList.remove('active'));
      tabPanels.forEach(p => p.classList.remove('active'));
      document.querySelector('[data-tab="tab-visualizer"]').classList.add('active');
      $('tab-visualizer').classList.add('active');
      runSingle(seed);
    });
  }
}

loadCuratedFromStorage();
restoreCuratedUI();

// ─── Advanced Visualizer ─────────────────────────────────────────────────────
const advSeedInput    = $('adv-seed-input');
const advBtnRun       = $('adv-btn-run');
const advBtnPlay      = $('adv-btn-play');
const advSpeedSelect  = $('adv-speed-select');
const advScrubber     = $('adv-scrubber');
const advFrameCounter = $('adv-frame-counter');
const advCanvas       = $('adv-canvas');

let advResult  = null;
let advFrame   = -1;
let advPlaying = false;
let advRafId   = null;
let advAccum   = 0;
let advLastTs  = null;

function advTotal() { return advResult ? advResult.path.length : 0; }
function advSpeed() { return parseFloat(advSpeedSelect.value) || 1; }

function advSync() {
  const t = advTotal();
  advScrubber.max   = Math.max(0, t - 1);
  advScrubber.value = advFrame < 0 ? t - 1 : advFrame;
  advFrameCounter.textContent = `${advFrame < 0 ? t : advFrame + 1} / ${t}`;
}

function advDraw() {
  if (!advResult) return;
  renderAdvanced(advResult, advCanvas, advFrame);
}

function advStop() {
  advPlaying = false;
  if (advRafId) { cancelAnimationFrame(advRafId); advRafId = null; }
  advBtnPlay.textContent = '\u25b6';
  advBtnPlay.classList.remove('playing');
}

function advStart() {
  if (!advResult || advTotal() === 0) return;
  if (advFrame < 0 || advFrame >= advTotal() - 1) {
    advFrame = 0;
    advAccum = 0;
  }
  advPlaying = true;
  advBtnPlay.textContent = '\u23f8';
  advBtnPlay.classList.add('playing');
  advLastTs = null;
  advRafId  = requestAnimationFrame(advLoop);
}

function advLoop(ts) {
  if (!advPlaying) return;
  if (advLastTs === null) advLastTs = ts;
  const dt = (ts - advLastTs) / 1000;
  advLastTs = ts;

  let slowFactor = 1;
  if (advResult.lastShotGoalX != null && advFrame >= 0) {
    const ballX = advResult.path[Math.min(advFrame, advResult.path.length - 1)]?.dist ?? 0;
    const distToGoal = Math.abs(advResult.lastShotGoalX - ballX);
    if (distToGoal <= 1200 && advFrame >= advResult.lastShotStartFrame) {
      slowFactor = 0.35;
    }
  }
  advAccum += dt * 60 * advSpeed() * slowFactor;
  const steps = Math.floor(advAccum);
  if (steps > 0) {
    advAccum -= steps;
    advFrame = Math.min(advFrame + steps, advTotal() - 1);
  }

  advDraw();
  advSync();

  if (advFrame >= advTotal() - 1) {
    advFrame = -1;
    advDraw();
    advSync();
    advStop();
    return;
  }
  advRafId = requestAnimationFrame(advLoop);
}

function advRun(seedOverride) {
  advStop();
  let seed;
  if (seedOverride !== undefined) {
    seed = seedOverride;
    advSeedInput.value = seed;
  } else {
    const raw = advSeedInput.value.trim();
    seed = raw === '' ? Math.floor(Math.random() * 4294967296) : parseInt(raw, 10);
    if (isNaN(seed)) seed = Math.floor(Math.random() * 4294967296);
    advSeedInput.value = seed;
  }
  advResult = activeGame.simulate(seed);

  // On goal outcomes, extend the path past the goalpost until the ball hits the ground
  const lastEv = advResult.events[advResult.events.length - 1];
  if (lastEv && lastEv.label === 'goal' && advResult.path.length >= 2) {
    const p = advResult.path;
    const n = p.length - 1;
    const vx = p[n].dist - p[n - 1].dist;
    let vy = (p[n].alt - p[n - 1].alt) - 1;
    let ballX = p[n].dist;
    let ballY = p[n].alt;
    const mult = p[n].mult;
    while (ballY > 0) {
      ballX += vx;
      ballY += vy;
      vy -= 1;
      p.push({ dist: ballX, alt: Math.max(0, ballY), mult });
    }
  }

  advFrame  = 0;
  advAccum  = 0;
  advDraw();
  advSync();
  advStart();
}

const advBtnCuratedRandom = $('adv-btn-curated-random');

advBtnRun.addEventListener('click', () => advRun());
advBtnCuratedRandom.addEventListener('click', () => {
  const seed = pickCuratedSeed();
  if (seed != null) advRun(seed);
});
advSeedInput.addEventListener('keydown', e => { if (e.key === 'Enter') advRun(); });

advBtnPlay.addEventListener('click', () => {
  if (advPlaying) advStop();
  else advStart();
});

advScrubber.addEventListener('input', () => {
  advStop();
  const v = parseInt(advScrubber.value, 10);
  advFrame = v >= advTotal() - 1 ? -1 : v;
  advDraw();
  advSync();
});

window.addEventListener('resize', () => {
  if (advResult && document.getElementById('tab-advanced')?.classList.contains('active')) {
    advDraw();
  }
});

loadAdvancedAssets();

// ─── Init ───────────────────────────────────────────────────────────────────
setActiveGame(listGames()[0].id);
runSingle();

})();

</script>
